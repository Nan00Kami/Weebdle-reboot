<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weebdle - Anime Character Wordle</title>
  <style>
    :root {
      --color-correct: #538d4e;
      --color-absent: #3a3a3c;
      --color-higher-lower: #b59f3b;
      --color-border: #3a3a3c;
      --color-bg: #121213;
      --color-text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 900px;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
      padding: 12px 0;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #game-container {
      width: 100%;
      max-width: 950px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-section {
      width: 100%;
      max-width: 450px;
      position: relative;
      margin-bottom: 24px;
    }
    input#guess-input {
      width: 100%;
      padding: 12px 16px;
      background: #272729;
      border: 1px solid var(--color-border);
      color: #fff;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
    }
    .suggestions {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: #272729;
      border: 1px solid var(--color-border);
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      border-radius: 0 0 4px 4px;
    }
    .suggestion-item {
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #333;
    }
    .suggestion-item:hover { background: #3a3a3c; }
    .suggestion-item img { width: 30px; height: 42px; object-fit: cover; border-radius: 2px; }
    
    /* Board Styling */
    .grid-header, .guess-row {
      display: grid;
      grid-template-columns: 60px 1.2fr 1.2fr 70px 70px 90px 90px 90px;
      gap: 6px;
      width: 100%;
      margin-bottom: 6px;
    }
    .grid-header div {
      font-size: 11px;
      font-weight: bold;
      color: #818384;
      text-align: center;
      text-transform: uppercase;
      padding-bottom: 4px;
    }
    .cell {
      height: 65px;
      background: #18181b;
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      padding: 4px;
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    .cell img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
    
    /* Flip Animation */
    .cell.flipped {
      animation: flip 0.6s ease forwards;
    }
    @keyframes flip {
      0% { transform: rotateX(0); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0); }
    }
    .cell.correct { background-color: var(--color-correct) !important; border: none; }
    .cell.absent { background-color: var(--color-absent) !important; border: none; }
    .cell.higher::after { content: ' ↑'; font-weight: bold; }
    .cell.lower::after { content: ' ↓'; font-weight: bold; }
    .cell.higher, .cell.lower { background-color: var(--color-higher-lower) !important; border: none; }

    #banner {
      margin-top: 15px;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>Anidle</header>

<div id="game-container">
  <div class="search-section">
    <input type="text" id="guess-input" placeholder="Guess a character..." autocomplete="off" />
    <div class="suggestions" id="suggestions" style="display: none;"></div>
  </div>

  <div class="grid-header">
    <div></div>
    <div>Character</div>
    <div>Anime</div>
    <div>Year</div>
    <div>Gender</div>
    <div>Genre</div>
    <div>Demographic</div>
    <div>Theme</div>
  </div>

  <div id="board"></div>
  <div id="banner"></div>
</div>

<script>
  // Fallback / mock dataset for direct preview
  let characters = [
    {
      character: "Lelouch Lamperouge",
      image: "https://cdn.myanimelist.net/images/characters/8/406163.jpg",
      anime: "Code Geass",
      year: 2006,
      gender: "Male",
      genre: "Action",
      demographic: "None",
      theme: "Mecha"
    },
    {
      character: "Spike Spiegel",
      image: "https://cdn.myanimelist.net/images/characters/4/50197.jpg",
      anime: "Cowboy Bebop",
      year: 1998,
      gender: "Male",
      genre: "Action",
      demographic: "None",
      theme: "Space"
    },
    {
      character: "Frieren",
      image: "https://cdn.myanimelist.net/images/characters/5/523456.jpg",
      anime: "Sousou no Frieren",
      year: 2023,
      gender: "Female",
      genre: "Adventure",
      demographic: "Shounen",
      theme: "None"
    }
  ];

  let target = null;
  let attempts = 0;
  const maxAttempts = 6;
  let gameOver = false;

  // Load external dataset generated by fetch_data.py if present
  fetch('characters.json')
    .then(res => res.json())
    .then(data => { characters = data; initGame(); })
    .catch(() => { initGame(); });

  function initGame() {
    target = characters[Math.floor(Math.random() * characters.length)];
  }

  const input = document.getElementById("guess-input");
  const suggestions = document.getElementById("suggestions");
  const board = document.getElementById("board");
  const banner = document.getElementById("banner");

  input.addEventListener("input", () => {
    const val = input.value.trim().toLowerCase();
    suggestions.innerHTML = "";
    if (!val) { suggestions.style.display = "none"; return; }

    const matches = characters.filter(c => c.character.toLowerCase().includes(val)).slice(0, 5);
    if (matches.length === 0) { suggestions.style.display = "none"; return; }

    matches.forEach(c => {
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `<img src="${c.image}" alt=""><span>${c.character} (${c.anime})</span>`;
      item.onclick = () => submitGuess(c);
      suggestions.appendChild(item);
    });
    suggestions.style.display = "block";
  });

  function submitGuess(guess) {
    if (gameOver) return;
    input.value = "";
    suggestions.style.display = "none";
    attempts++;

    renderGuessRow(guess);

    const isCharMatch = guess.character.toLowerCase() === target.character.toLowerCase();
    const isAnimeMatch = guess.anime.toLowerCase() === target.anime.toLowerCase();

    if (isCharMatch) {
      gameOver = true;
      banner.style.color = "var(--color-correct)";
      banner.textContent = `Magnificent! You identified ${target.character}!`;
      input.disabled = true;
    } else if (isAnimeMatch && attempts <= maxAttempts) {
      banner.style.color = "var(--color-higher-lower)";
      banner.textContent = `Correct series (${target.anime})! Keep going for the character!`;
    } else if (attempts >= maxAttempts) {
      gameOver = true;
      banner.style.color = "#e74c3c";
      banner.textContent = `Game Over! The character was ${target.character} from ${target.anime}.`;
      input.disabled = true;
    }
  }

  function renderGuessRow(guess) {
    const row = document.createElement("div");
    row.className = "guess-row";

    const fields = [
      { key: "image", val: guess.image, type: "img" },
      { key: "character", val: guess.character, correct: guess.character === target.character },
      { key: "anime", val: guess.anime, correct: guess.anime === target.anime },
      { key: "year", val: guess.year, type: "numeric" },
      { key: "gender", val: guess.gender, correct: guess.gender === target.gender },
      { key: "genre", val: guess.genre, correct: guess.genre === target.genre },
      { key: "demographic", val: guess.demographic, correct: guess.demographic === target.demographic },
      { key: "theme", val: guess.theme, correct: guess.theme === target.theme }
    ];

    fields.forEach((field, idx) => {
      const cell = document.createElement("div");
      cell.className = "cell";

      if (field.type === "img") {
        cell.innerHTML = `<img src="${field.val}" alt="">`;
      } else {
        cell.textContent = field.val;
      }

      row.appendChild(cell);

      // Staggered NYT-style flip
      setTimeout(() => {
        cell.classList.add("flipped");
        if (field.type === "numeric") {
          if (guess.year === target.year) cell.classList.add("correct");
          else if (guess.year < target.year) cell.classList.add("higher");
          else cell.classList.add("lower");
        } else if (field.type !== "img") {
          cell.classList.add(field.correct ? "correct" : "absent");
        }
      }, idx * 250);
    });

    board.appendChild(row);
  }
</script>
</body>
</html>
