<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weebdle</title>
  <style>
    :root {
      --color-correct: #538d4e;
      --color-absent: #3a3a3c;
      --color-direction: #b59f3b;
      --color-border: #3a3a3c;
      --color-bg: #121213;
      --color-text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
      padding: 14px 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
    }
    #game-container {
      width: 100%;
      max-width: 950px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .input-box-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin-bottom: 24px;
    }
    #search-box {
      width: 100%;
      padding: 12px 16px;
      background: #272729;
      border: 1px solid var(--color-border);
      color: #fff;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
    }
    .autocomplete-list {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: #272729;
      border: 1px solid var(--color-border);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      border-radius: 0 0 4px 4px;
    }
    .autocomplete-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .autocomplete-item:hover { background: #3a3a3c; }
    .autocomplete-item img { width: 32px; height: 44px; object-fit: cover; border-radius: 2px; }

    .row-layout {
      display: grid;
      grid-template-columns: 60px 1.3fr 1.3fr 75px 75px 95px 95px 95px;
      gap: 6px;
      width: 100%;
      margin-bottom: 6px;
    }
    .grid-header div {
      font-size: 11px;
      font-weight: 700;
      color: #818384;
      text-align: center;
      text-transform: uppercase;
      padding-bottom: 4px;
    }
    .cell {
      height: 64px;
      background: #18181b;
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      padding: 4px;
      perspective: 1000px;
      overflow: hidden;
      word-break: break-word;
    }
    .cell img { width: 100%; height: 100%; object-fit: cover; }
    
    .cell.flipped {
      animation: flip-cell 0.5s ease forwards;
    }
    @keyframes flip-cell {
      0% { transform: rotateX(0); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0); }
    }
    .cell.correct { background-color: var(--color-correct) !important; border: none; }
    .cell.absent { background-color: var(--color-absent) !important; border: none; }
    .cell.up::after { content: ' ↑'; font-weight: bold; }
    .cell.down::after { content: ' ↓'; font-weight: bold; }
    .cell.up, .cell.down { background-color: var(--color-direction) !important; border: none; }

    #status-banner {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

<header>WEEBDLE</header>

<div id="game-container">
  <div class="input-box-wrapper">
    <input type="text" id="search-box" placeholder="Guess a character..." autocomplete="off" />
    <div id="autocomplete" class="autocomplete-list" style="display: none;"></div>
  </div>

  <div class="row-layout grid-header">
    <div></div>
    <div>Character</div>
    <div>Anime</div>
    <div>Year</div>
    <div>Gender</div>
    <div>Genre</div>
    <div>Demographic</div>
    <div>Theme</div>
  </div>

  <div id="board" style="width: 100%;"></div>
  <div id="status-banner"></div>
</div>

<script>
  let characters = [];
  let target = null;
  let attempts = 0;
  const maxAttempts = 6;
  let isGameOver = false;

  const searchBox = document.getElementById("search-box");
  const autocomplete = document.getElementById("autocomplete");
  const board = document.getElementById("board");
  const statusBanner = document.getElementById("status-banner");

  fetch('characters.json')
    .then(res => res.json())
    .then(data => {
      characters = data;
      // Daily seed based on UTC date
      const now = new Date();
      const seed = now.getUTCFullYear() * 10000 + (now.getUTCMonth() + 1) * 100 + now.getUTCDate();
      target = characters[seed % characters.length];
    })
    .catch(() => {
      statusBanner.textContent = "Unable to load characters.json database.";
    });

  searchBox.addEventListener("input", () => {
    const val = searchBox.value.trim().toLowerCase();
    autocomplete.innerHTML = "";
    if (val.length < 2) {
      autocomplete.style.display = "none";
      return;
    }

    const matches = characters.filter(c => c.name.toLowerCase().includes(val)).slice(0, 8);
    if (!matches.length) {
      autocomplete.style.display = "none";
      return;
    }

    matches.forEach(c => {
      const row = document.createElement("div");
      row.className = "autocomplete-item";
      row.innerHTML = `<img src="${c.image}"><span>${c.name} (${c.anime})</span>`;
      row.onclick = () => {
        searchBox.value = "";
        autocomplete.style.display = "none";
        executeGuess(c);
      };
      autocomplete.appendChild(row);
    });
    autocomplete.style.display = "block";
  });

  function executeGuess(guess) {
    if (isGameOver || !target) return;
    attempts++;
    renderRow(guess);

    const charMatch = guess.name.toLowerCase() === target.name.toLowerCase();
    const animeMatch = guess.anime.toLowerCase() === target.anime.toLowerCase();

    if (charMatch) {
      isGameOver = true;
      statusBanner.style.color = "var(--color-correct)";
      statusBanner.textContent = `Victory! You identified ${target.name}!`;
      searchBox.disabled = true;
    } else if (animeMatch && attempts <= maxAttempts) {
      statusBanner.style.color = "var(--color-direction)";
      statusBanner.textContent = `Correct series (${target.anime})! Keep guessing the character!`;
    } else if (attempts >= maxAttempts) {
      isGameOver = true;
      statusBanner.style.color = "#e74c3c";
      statusBanner.textContent = `Game Over! The character was ${target.name} (${target.anime}).`;
      searchBox.disabled = true;
    }
  }

  function renderRow(guess) {
    const row = document.createElement("div");
    row.className = "row-layout";

    const columns = [
      { type: "img", val: guess.image },
      { type: "str", val: guess.name, isMatch: guess.name === target.name },
      { type: "str", val: guess.anime, isMatch: guess.anime === target.anime },
      { type: "num", val: guess.year, target: target.year },
      { type: "str", val: guess.gender, isMatch: guess.gender === target.gender },
      { type: "str", val: guess.genre, isMatch: guess.genre === target.genre },
      { type: "str", val: guess.demographic, isMatch: guess.demographic === target.demographic },
      { type: "str", val: guess.theme, isMatch: guess.theme === target.theme }
    ];

    columns.forEach((col, idx) => {
      const cell = document.createElement("div");
      cell.className = "cell";

      if (col.type === "img") {
        cell.innerHTML = `<img src="${col.val}" alt="">`;
      } else {
        cell.textContent = col.val;
      }

      row.appendChild(cell);

      setTimeout(() => {
        cell.classList.add("flipped");
        if (col.type === "str") {
          cell.classList.add(col.isMatch ? "correct" : "absent");
        } else if (col.type === "num") {
          const gYear = parseInt(col.val, 10);
          const tYear = parseInt(col.target, 10);
          if (isNaN(gYear) || isNaN(tYear) || gYear === tYear) {
            cell.classList.add(gYear === tYear ? "correct" : "absent");
          } else {
            cell.classList.add(gYear < tYear ? "up" : "down");
          }
        }
      }, idx * 200);
    });

    board.appendChild(row);
  }
</script>
</body>
</html>
