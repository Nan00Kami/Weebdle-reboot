name: Scheduled MyAnimeList Character Scraper

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger execution anytime from the GitHub UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial permission allowing the runner to push data updates

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run scraper script
      run: python scraper.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add mal_characters.json
        
        # Check if file changed to prevent empty commit errors
        if git diff-index --quiet HEAD; then
          echo "No changes found in data profile."
        else
          git commit -m "Automated update: Refreshed character data"
          git push
        fi
